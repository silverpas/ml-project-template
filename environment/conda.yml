# Python packages for the Azure ML jobs (jobs/*.yml).
# Same versions as requirements.txt, so a model trains the same in Azure as on
# your laptop. tests/test_azure_files.py checks that the two files match.
# Only addition: azureml-mlflow, which lets MLflow write to the Azure ML
# workspace (runs and model registry) instead of the local mlflow.db.
name: ml-project
channels:
  - conda-forge
dependencies:
  - python=3.11
  - pip
  - pip:
      - pandas==3.1.1
      - pyarrow==26.0.1
      - pyyaml==6.0.3
      - scikit-learn==1.9.1
      - lightgbm==4.7.0
      - mlflow==3.18.0
      - deltalake==1.7.0
      - azureml-mlflow==1.62.0.post7
