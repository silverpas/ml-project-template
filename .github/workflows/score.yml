# Nightly scoring in Azure ML (design option B, the default): submits
# jobs/batch-score.yml, which scores new data with the champion model and
# writes the predictions as a Delta table (scoring.predictions_table) to the
# job's output; with the Fabric connection, to the Gold table in Fabric.

name: Score (nightly, Azure ML)

on:
  schedule:
    - cron: "0 2 * * *" # every night at 02:00 UTC
  workflow_dispatch: # or by hand from the Actions tab

permissions:
  id-token: write # OIDC login to Azure
  contents: read

jobs:
  score:
    name: Batch score with the champion
    if: vars.AZURE_ML_WORKSPACE != ''
    runs-on: ubuntu-latest
    steps:
      - name: Get the code
        uses: actions/checkout@v7

      - name: Log in to Azure (OIDC)
        uses: azure/login@v3
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Install the Azure ML CLI and select the workspace
        run: |
          az extension add --name ml --yes
          az configure --defaults group="${{ vars.AZURE_RESOURCE_GROUP }}" workspace="${{ vars.AZURE_ML_WORKSPACE }}"

      # EXAMPLE DATA ONLY: the job uploads data/raw/ai4i2020.csv from this
      # computer. With the Fabric connection (design section 9) the job reads
      # the Gold table instead and this step goes away.
      - name: Get the example data
        run: |
          python3 - <<'EOF'
          import io, pathlib, urllib.request, zipfile
          url = "https://archive.ics.uci.edu/static/public/601/ai4i+2020+predictive+maintenance+dataset.zip"
          archive = zipfile.ZipFile(io.BytesIO(urllib.request.urlopen(url).read()))
          name = next(n for n in archive.namelist() if n.endswith(".csv"))
          pathlib.Path("data/raw").mkdir(parents=True, exist_ok=True)
          pathlib.Path("data/raw/ai4i2020.csv").write_bytes(archive.read(name))
          EOF

      - name: Run the batch-score job in Azure ML
        run: |
          job=$(az ml job create --file jobs/batch-score.yml --query name --output tsv)
          # Wait for the job by asking for its status every 30 seconds. (Following
          # the live log with "az ml job stream" fails in some CLI versions.)
          echo "Job $job: https://ml.azure.com/runs/$job"
          while true; do
            status=$(az ml job show --name "$job" --query status --output tsv)
            echo "$(date -u +%H:%M:%S) $status"
            case "$status" in
              Completed) break ;;
              Failed|Canceled|NotResponding) echo "Job ended with status $status"; exit 1 ;;
            esac
            sleep 30
          done
          echo "Scored with job \`$job\`; predictions in its output \`predictions\`." >> "$GITHUB_STEP_SUMMARY"
