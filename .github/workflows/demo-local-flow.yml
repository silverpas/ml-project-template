# DEMO ONLY, NOT THE PRODUCTION PIPELINE.
# The full model flow on GitHub's own computers, without Azure: a way to see
# the approval gate work before your project has Azure access. Production uses
# train.yml → deploy.yml → score.yml, which run in Azure ML.
#
# Safe to delete once your project runs in Azure. It needs the GitHub
# environment "approval-demo" with required reviewers (Settings → Environments).
#
#   1. train   prep → train → evaluate → register as "candidate"
#              → results table on the run page
#   2. deploy  waits for a reviewer to click "Approve"   (the approval gate)
#              → model becomes "champion" → scoring → predictions to download
#
# The Azure version (train.yml + deploy.yml, coming later) has the same steps;
# it only runs the work in Azure ML and writes predictions to Fabric.
#
# Start it from the Actions tab ("Run workflow"), or push a change to the code
# or settings. Tip: change a model setting in config.yml and see whether the
# new model beats the champion.

name: Demo flow (no Azure, not production)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "config.yml"
      - "requirements.txt"

# One demo run at a time, because runs share the model registry (see below).
concurrency:
  group: demo-pipeline
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  train:
    name: Train and evaluate
    runs-on: ubuntu-latest
    outputs:
      is_candidate: ${{ steps.decision.outputs.is_candidate }}
      version: ${{ steps.decision.outputs.version }}
    steps:
      - name: Get the code
        uses: actions/checkout@v7

      - name: Install Python 3.11
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip

      - name: Install packages
        run: pip install -r requirements.txt

      # GitHub's computers start empty every time. Bring back the model
      # registry (and the downloaded data) saved by the last approved run,
      # so the new model has a champion to beat. The first run starts fresh.
      # Note: GitHub deletes a cache that is unused for 7 days.
      - name: Restore the model registry from the last approved run
        uses: actions/cache/restore@v6
        with:
          path: |
            mlflow.db
            mlruns
            data/raw
          key: demo-registry-${{ github.run_id }}
          restore-keys: demo-registry-

      - name: Prepare data
        run: python -m src.prep

      - name: Train
        run: python -m src.train

      - name: Compare with the champion
        run: python -m src.evaluate

      - name: Register if better
        run: python -m src.register

      - name: Show the results on the run page
        run: cat outputs/evaluation.md >> "$GITHUB_STEP_SUMMARY"

      - name: Pass the decision to the next job
        id: decision
        run: |
          python - >> "$GITHUB_OUTPUT" <<'EOF'
          import json
          evaluation = json.load(open("outputs/evaluation.json"))
          registration = json.load(open("outputs/registration.json"))
          print(f"is_candidate={str(evaluation['is_candidate']).lower()}")
          print(f"version={registration['version'] or ''}")
          EOF

      # Jobs run on separate computers: hand the registry over to the deploy job.
      - name: Hand the registry to the next job
        uses: actions/upload-artifact@v7
        with:
          name: pipeline-state
          path: |
            mlflow.db
            mlruns
            data/raw
          retention-days: 7

  deploy:
    name: Approve and score
    needs: train
    # Only when there is something to approve.
    if: needs.train.outputs.is_candidate == 'true'
    runs-on: ubuntu-latest
    # THE APPROVAL GATE. GitHub pauses here until a required reviewer of the
    # "approval-demo" environment clicks Approve (Settings → Environments).
    environment: approval-demo
    steps:
      - name: Get the code
        uses: actions/checkout@v7

      - name: Install Python 3.11
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip

      - name: Install packages
        run: pip install -r requirements.txt

      - name: Get the registry from the train job
        uses: actions/download-artifact@v8
        with:
          name: pipeline-state

      - name: Promote the approved model to champion
        run: python -m src.register --promote "${{ needs.train.outputs.version }}"

      # In real use you would score NEW data; the demo re-uses the dataset.
      - name: Score with the champion
        run: python -m src.score --input data/raw/ai4i2020.csv --output data/predictions/predictions.csv

      - name: Show the result on the run page
        run: |
          {
            echo "## Approved and scored"
            echo ""
            echo "Version ${{ needs.train.outputs.version }} is now the **champion**."
            echo "Download the predictions under **Artifacts** → \`predictions\` on this page."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Make the predictions downloadable
        uses: actions/upload-artifact@v7
        with:
          name: predictions
          path: data/predictions/predictions.csv
          retention-days: 7

      # Save the registry with the new champion for the next run.
      - name: Remember the registry for the next run
        uses: actions/cache/save@v6
        with:
          path: |
            mlflow.db
            mlruns
            data/raw
          key: demo-registry-${{ github.run_id }}
