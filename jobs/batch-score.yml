# Azure ML job: score new data with the approved (champion) model and write
# the predictions to the Gold table in Fabric (config.yml:
# scoring.predictions_table, e.g. ml_tool_wear_predictions). Default scoring
# path (design option B).
#
# Submitted every night by .github/workflows/score.yml, or by hand:
#   az ml job create --file jobs/batch-score.yml
#
# score.py finds the champion in the workspace registry through MLflow
# (Azure ML sets MLFLOW_TRACKING_URI inside the job).
$schema: https://azuremlschemas.azureedge.net/latest/commandJob.schema.json
type: command
display_name: tool-wear batch-score
experiment_name: tool-wear-scoring

code: ../

# src.cost start/end: the job's duration and estimated cost, logged to MLflow.
command: >-
  python -m src.cost start &&
  python -m src.score
  --input ${{inputs.input_data}}
  --output ${{inputs.predictions_table}} &&
  python -m src.cost end

inputs:
  input_data:
    type: uri_file
    # ASSUMPTION: new rows to score are exported to this OneLake path
    # (same datastore as the training data). Change it to yours.
    path: azureml://datastores/onelake_manufacturing/paths/Files/ml/tool-wear/to-score/latest.csv
    mode: download

  # The Gold table, written as a Delta table (Fabric's table format), so it
  # shows up in the lakehouse's Tables and Power BI can read it right away.
  # Each night replaces the rows; Delta keeps older versions (time travel).
  # Written directly to OneLake (abfss://), not through a datastore: Azure ML's
  # OneLake datastores only reach the Files folder, not Tables.
  # ASSUMPTION: Fabric workspace "manufacturing" with a lakehouse "gold"; the
  # ml-project module's identity gets write access to it (data_access_todo).
  # The last part must be config.yml's predictions_table.
  predictions_table: abfss://manufacturing@onelake.dfs.fabric.microsoft.com/gold.Lakehouse/Tables/ml_tool_wear_predictions

environment:
  image: mcr.microsoft.com/azureml/openmpi4.1.0-ubuntu22.04:latest
  conda_file: ../environment/conda.yml

# ASSUMPTION: the project's own cluster, the same as for training.
compute: azureml:cpu-tool-wear
