# Azure ML job: score new data with the approved (champion) model and write
# the predictions as a Delta table called like config.yml's
# scoring.predictions_table (ml_tool_wear_predictions). Default scoring path
# (design option B).
#
# For now the table goes to the job's output folder (download it with
# `az ml job download --name <job> --output-name predictions`). With the Fabric
# connection (design section 9) it goes straight to the Gold lakehouse.
#
# Submitted every night by .github/workflows/score.yml, or by hand:
#   az ml job create --file jobs/batch-score.yml
#
# score.py finds the champion in the workspace registry through MLflow
# (Azure ML sets MLFLOW_TRACKING_URI inside the job).
$schema: https://azuremlschemas.azureedge.net/latest/commandJob.schema.json
type: command
display_name: tool-wear batch-score
experiment_name: tool-wear-scoring

code: ../

# src.cost start/end: the job's duration and estimated cost, logged to MLflow.
command: >-
  python -m src.cost start &&
  python -m src.score
  --input ${{inputs.input_data}}
  --output ${{outputs.predictions}}/ml_tool_wear_predictions &&
  python -m src.cost end

inputs:
  input_data:
    type: uri_file
    # A file on YOUR computer, uploaded with the job. The example scores the
    # training file again; in real use these are NEW rows.
    path: ../data/raw/ai4i2020.csv
    mode: download

outputs:
  # The predictions, as a Delta table (Fabric's table format) inside this folder.
  # mode upload: written on the machine's disk, uploaded when the job ends.
  # Later, with the Fabric connection, --output becomes the Gold table address:
  # abfss://<workspace>@onelake.dfs.fabric.microsoft.com/<lakehouse>.Lakehouse/Tables/ml_tool_wear_predictions
  predictions:
    type: uri_folder
    mode: upload

environment:
  image: mcr.microsoft.com/azureml/openmpi4.1.0-ubuntu22.04:latest
  conda_file: ../environment/conda.yml

# ASSUMPTION: the project's own cluster, the same as for training.
compute: azureml:cpu-tool-wear
