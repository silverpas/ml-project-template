# Azure ML job: prepare → train → evaluate → register, on a cloud computer.
# The same scripts as on your laptop; only the data path and computer differ.
#
# Submitted by .github/workflows/train.yml, or by hand:
#   az ml job create --file jobs/train-register.yml
#
# Inside the job, Azure ML sets MLFLOW_TRACKING_URI, so MLflow logs to the
# workspace and registers the model there (see src/common.py).
# Files the scripts write to ./outputs/ are saved with the job automatically.
$schema: https://azuremlschemas.azureedge.net/latest/commandJob.schema.json
type: command
display_name: tool-wear train-register
experiment_name: tool-wear # same as mlflow.experiment in config.yml

code: ../ # the whole repo (files listed in .gitignore are not uploaded)

# src.cost start/end: the job's duration and estimated cost, logged to MLflow.
command: >-
  python -m src.cost start &&
  python -m src.prep --input ${{inputs.training_data}} &&
  python -m src.train &&
  python -m src.evaluate &&
  python -m src.register &&
  python -m src.cost end

inputs:
  training_data:
    type: uri_file
    # A file on YOUR computer: `az ml job create` uploads it with the job (run
    # `python -m src.prep` once first, so the example data is downloaded).
    # prep.py logs its fingerprint, so the run can be traced back to the data.
    path: ../data/raw/ai4i2020.csv
    mode: download
    # Later, with the Fabric connection (design section 9): a Gold table
    # address, read by src/data.py, e.g.
    # abfss://<workspace>@onelake.dfs.fabric.microsoft.com/<lakehouse>.Lakehouse/Tables/<table>

environment:
  image: mcr.microsoft.com/azureml/openmpi4.1.0-ubuntu22.04:latest
  conda_file: ../environment/conda.yml

# The project's own cluster (ml-project module: cpu-<use case>, scales to 0,
# runs as the project's identity). ASSUMPTION: the default name; the platform
# team gives you the real one (output `cluster`).
compute: azureml:cpu-tool-wear
